name: pk-jenkins
services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: pk-jenkins-controller:2.580.1
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xms512m -Xmx2g
    ports:
      - 127.0.0.1:18081:8080
    volumes:
      - /opt/pk-jenkins/controller:/var/jenkins_home
      - /opt/pk-jenkins/bootstrap:/run/bootstrap:ro
    networks: [control]
    mem_limit: 3g
    cpus: 2
  docker:
    image: docker:29.8.1-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-data:/var/lib/docker
      - docker-certs:/certs/client
      - /opt/pk-jenkins/agent:/home/jenkins/agent
    networks: [build]
    mem_limit: 20g
    cpus: 12
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: pk-jenkins-agent:2.580.1
    restart: unless-stopped
    depends_on: [controller, docker]
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: '1'
      DOCKER_CERT_PATH: /certs/client
    volumes:
      - /opt/pk-jenkins/agent:/home/jenkins/agent
      - /opt/pk-jenkins/agent/.ssh:/var/jenkins_home/.ssh:ro
      - /srv/jenkins-packages/sub2api:/srv/jenkins-packages/sub2api
      - /srv/jenkins-evidence/sub2api:/srv/jenkins-evidence/sub2api:ro
      - docker-certs:/certs/client:ro
      - /opt/pk-jenkins/bootstrap/agent-secret:/run/secrets/agent-secret:ro
    networks: [control, build]
    mem_limit: 2g
    cpus: 2
volumes:
  docker-data:
  docker-certs:
networks:
  control:
  build:
