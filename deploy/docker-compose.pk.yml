# Merge into the EXISTING production Compose file; retain its data volumes,
# database, Redis, ports and all existing environment variables.
services:
  sub2api:
    image: ghcr.io/pengkang0322/sub2api:${SUB2API_PK_VERSION:?Set an approved PK image version}
    restart: unless-stopped
    environment:
      SUB2API_DOCKER_SELF_UPDATE: "true"
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:?Set a token with read access to this private repository}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      TURNSTILE_REQUIRED: ${TURNSTILE_REQUIRED:-false}
      TURNSTILE_EXPECTED_HOSTNAME: ${TURNSTILE_EXPECTED_HOSTNAME:-}
