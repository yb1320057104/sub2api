<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>集群统一更新</title>
<style>body{font:16px/1.6 system-ui;background:#f5f7fb;color:#172238;margin:0}main{max-width:960px;margin:40px auto;padding:28px}h1{font-size:30px}section{background:#fff;border:1px solid #dce3ee;border-radius:14px;padding:24px;margin:18px 0}.nodes{display:grid;grid-template-columns:1fr 1fr;gap:20px}.version{font-size:21px;font-weight:650;overflow-wrap:anywhere}.muted{color:#67758b}button,a.button{font:inherit;border:0;border-radius:8px;background:#245bd7;color:white;padding:11px 18px;cursor:pointer;display:inline-block;text-decoration:none}button:disabled{opacity:.45;cursor:default}button.secondary{background:#e8edf6;color:#173064}#error{color:#b42318;white-space:pre-wrap}#job{white-space:pre-wrap}[hidden]{display:none!important}@media(max-width:600px){main{margin:12px auto;padding:16px}.nodes{grid-template-columns:1fr}}</style>
<main><a href="/admin/dashboard">← 返回管理后台</a><h1>集群统一更新</h1><p class="muted">检查 GitHub 最新正式发布。确认一次后，构建同一个版本，依次更新两台 API 和后台任务实例。</p>
<section id="login" hidden><p>请在当前域名登录项目管理员账号，再返回此页面。</p><a class="button" href="/login">前往登录</a></section>
<section><div class="nodes"><div><h2>主节点</h2><div id="primary" class="version">—</div><div id="primaryReady" class="muted">状态未知</div><p>后台任务：<span id="primaryWorker">—</span></p></div><div><h2>副节点</h2><div id="secondary" class="version">—</div><div id="secondaryReady" class="muted">状态未知</div><p>后台任务：<span id="secondaryWorker">—</span></p></div></div><p>最新正式发布：<strong id="latest">尚未确认</strong></p><p id="status">正在读取状态…</p><p class="muted" id="checked"></p><button id="check" class="secondary">立即检查</button></section>
<section><h2>一次确认，统一更新</h2><p id="target">登录管理员账号后显示可更新版本。</p><p class="muted">API 逐台切换，等待现有请求结束。后台任务保持单活。失败时停止后续步骤，并保留恢复所需记录。</p><button id="approve" disabled hidden>确认更新</button></section>
<section><h2>最近更新任务</h2><div id="job">暂无任务</div></section><p id="error" role="alert"></p></main><script src="/cluster-update/app.js"></script></html>
