name: PK Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed tag, for example v0.2.10-pk.1'
        required: true
        type: string

concurrency:
  group: pk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'pengkang0322/sub2api' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      IMAGE: ghcr.io/pengkang0322/sub2api
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate the reviewed release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-pk\.[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists; publish a new PK revision.' >&2
            exit 1
          fi
          version=${RELEASE_TAG#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend with type and translation checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check update and private download behavior in CI
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/repository -run 'Test(CompareVersions|ParseVersion|ValidateDownloadURL|UpdateService|GitHub|Github|PrivateRelease)' -count=1
      - name: Build the server and its update archive
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.sha }}
          DATE: ${{ steps.release.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embed -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$COMMIT -X main.Date=$DATE -X main.BuildType=release" \
            -o ../sub2api ./cmd/server
          cd ..
          ./sub2api -version 2>&1 | grep -F "$VERSION"
          tar -czf "release-output/sub2api_${VERSION}_linux_amd64.tar.gz" sub2api
          (cd release-output && sha256sum *.tar.gz > checksums.txt)
      - uses: docker/setup-buildx-action@v3
      - name: Build the exact same binary into the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goreleaser
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/pengkang0322/sub2api
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
      - name: Verify persistent startup and unprivileged runtime in CI
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          volume=pk-release-check-${GITHUB_RUN_ID}
          docker volume create "$volume"
          trap 'docker volume rm "$volume" >/dev/null' EXIT
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" -version 2>&1 | grep -F "$VERSION"
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" -version 2>&1 | grep -F "$VERSION"
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" sh -ec '
            test "$(id -u)" != 0
            test -x /app/data/bin/sub2api
            test -w /app/data/bin
            test ! -w /app/sub2api
            test -s /app/data/bin/.image-seed.sha256
            cmp /app/sub2api /app/data/bin/sub2api
          '
          # An ELF binary can carry trailing data. Simulate a different installed
          # update without generating test files or changing application behavior.
          updated_hash=$(docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" sh -ec '
            printf "\nPK_CI_UPDATED\n" >> /app/data/bin/sub2api
            sha256sum /app/data/bin/sub2api
          ')
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" -version 2>&1 | grep -F "$VERSION"
          test "$updated_hash" = "$(docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" sha256sum /app/data/bin/sub2api)"
          # Recover an interrupted replacement from the previous executable.
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" mv /app/data/bin/sub2api /app/data/bin/sub2api.backup
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" -version 2>&1 | grep -F "$VERSION"
          test "$updated_hash" = "$(docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" sha256sum /app/data/bin/sub2api)"
          # A different image seed must replace the web update; returning to the
          # original image must restore its seed, too. This image is CI-only.
          printf 'FROM %s\nRUN chmod 0755 /app/sub2api && printf "PK_CI_IMAGE" >> /app/sub2api && chmod 0555 /app/sub2api\n' \
            "$IMAGE:$VERSION" | docker build -t pk-ci-seed -
          docker run --rm -v "$volume:/app/data" pk-ci-seed -version 2>&1 | grep -F "$VERSION"
          docker run --rm -v "$volume:/app/data" pk-ci-seed cmp /app/sub2api /app/data/bin/sub2api
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" -version 2>&1 | grep -F "$VERSION"
          docker run --rm -v "$volume:/app/data" "$IMAGE:$VERSION" cmp /app/sub2api /app/data/bin/sub2api
      - name: Login to the private container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require private package visibility
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          req = urllib.request.Request(
              'https://api.github.com/users/pengkang0322/packages/container/sub2api',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'pk-release'})
          try:
              with urllib.request.urlopen(req) as response:
                  assert json.load(response)['visibility'] == 'private', 'Existing package must be private'
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          PY
      - name: Publish the image and matching private release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$VERSION"
          test "$(gh api users/pengkang0322/packages/container/sub2api --jq .visibility)" = private
          printf 'PK出版。\n\nSource: `%s`\nImage: `%s:%s`\n\nContains existing cache conversion, billing and downstream usage customizations. Publishing does not update the production server.\n' \
            "$COMMIT" "$IMAGE" "$VERSION" > release-output/notes.md
          gh release create "$RELEASE_TAG" \
            "release-output/sub2api_${VERSION}_linux_amd64.tar.gz" release-output/checksums.txt \
            --verify-tag --latest --prerelease=false --title "$VERSION PK出版" \
            --notes-file release-output/notes.md
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"
